name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check publication contents
        run: python scripts/publication_check.py
      - name: Check Python source
        run: python -m compileall -q client_backend async_runtime.py backend_entry.py
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build frontend
        working-directory: desktop
        run: npm run build
      - name: Check Electron entry point
        run: node --check desktop/electron/main.cjs
